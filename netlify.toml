# Static site. The site config on Netlify still carries Gatsby-era settings
# in its UI (build command, and a deploy stage that insists on a directory
# named "public"), so the simplest robust move is to assemble the site into
# public/ ourselves and publish that.
[build]
  command = "rm -rf public && mkdir public && cp -r index.html assets public/"
  publish = "public"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
