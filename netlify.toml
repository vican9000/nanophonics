# Static site: there is nothing to build. The explicit no-op command below
# overrides the Gatsby build command still stored in the Netlify UI; toml
# only wins for keys it actually sets, which is why publish alone was not
# enough and the first deploy failed on "gatsby: command not found".
[build]
  command = "echo static site, nothing to build"
  publish = "."

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
